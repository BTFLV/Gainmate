[workspace]
members = ["crates/gainmate-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep local builds practical on laptops; full debug symbols can be opted into.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
