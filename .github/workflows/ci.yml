name: Quality
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: .audio-build
          key: audio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-audio.sh') }}
      - run: npm ci
      - run: npm run audio:build
      - name: Use the bundled audio tools in tests
        run: |
          echo "GAINMATE_FFMPEG=$PWD/src-tauri/binaries/ffmpeg-aarch64-apple-darwin" >> "$GITHUB_ENV"
          echo "GAINMATE_FFPROBE=$PWD/src-tauri/binaries/ffprobe-aarch64-apple-darwin" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      # Release packaging builds the frontend; PRs validate it here.
      - if: github.event_name == 'pull_request'
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=2
      - run: npx playwright install chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-failures
          path: test-results/
          if-no-files-found: ignore
